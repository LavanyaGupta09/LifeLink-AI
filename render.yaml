services:
  - type: web
    name: lifelink-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # You can override these in the Render Dashboard later!
      - key: APP_ENV
        value: production
      - key: USE_MOCK_APIS
        value: "True"
